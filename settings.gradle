pluginManagement {
    repositories {
        if (providers.gradleProperty('neoForgeMaven').isPresent()) {
            maven {
                url = providers.gradleProperty('neoForgeMaven').get()
                content { includeGroupByRegex 'net\\.neoforged(\\..*)?' }
            }
        }
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'MKB-Export'
include 'common', 'neoforge-1.21.1', 'forge-1.20.1'

if (providers.gradleProperty("appearanceExample").isPresent()) { include "verification-adapter" }
