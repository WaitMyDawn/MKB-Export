plugins { id 'net.neoforged.moddev.legacyforge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 17
}
base.archivesName = 'mkb_export-forge-1.20.1'
sourceSets.main.java.srcDir rootProject.file('shared-client/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('shared-client/src/main/resources')
dependencies {
    implementation project(':common')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

legacyForge {
    version = '1.20.1-47.3.22'
    runs {
        client {
            client()
            if(providers.gradleProperty('equipmentProbe').isPresent())systemProperty 'mkb_export.equipmentProbe','true'
            gameDirectory = providers.gradleProperty('gameDirectory').map { file(it) }.getOrElse(file('run'))
            if(providers.gradleProperty('adapterFailure').isPresent())systemProperty 'mkb_export.example.fail', 'true'
            programArguments.addAll('--username', 'MKB_Developer')
            if(providers.gradleProperty('entitySize').isPresent())systemProperty 'mkb_export.entitySize', providers.gradleProperty('entitySize').get()
            if(providers.gradleProperty('entityNonLiving').isPresent())systemProperty 'mkb_export.entityNonLiving', providers.gradleProperty('entityNonLiving').get()
            if (providers.gradleProperty('exportSmoke').isPresent()) {
                systemProperty 'mkb_export.smoke', 'true'
                if(providers.gradleProperty('singlePassSmoke').isPresent())systemProperty 'mkb_export.smoke.singlePass','true'
                systemProperty 'mkb_export.smoke.selector', providers.gradleProperty('exportSmoke').get() == 'world' ? '@world' : providers.gradleProperty('exportSmoke').get() == 'all' ? '*' : providers.gradleProperty('exportSmoke').get() == 'states' ? '@states' : providers.gradleProperty('exportSmoke').get() == 'config' ? '@config' : providers.gradleProperty('exportSmoke').get() == 'config_restore' ? '@config_restore' : '@smoke'
            }
        }
    }
    mods {
        mkb_export {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

tasks.named('jar') { from project(':common').sourceSets.main.output }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.named('processResources') { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand(version: project.version) } }

// 平台属性回归使用与生产代码相同的游戏类及依赖。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Forge 发行包从清单发现采样实体的局部 tick 保护。
tasks.named("jar") { manifest.attributes("MixinConfigs": "mkb_export.mixins.json") }
